<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiservicios El King — Apertura de Caja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="caja-wrap">
    <div class="caja-card">
      <button class="btn-back" onclick="window.location.href='../public/login.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Volver al login
      </button>

      <div class="icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2.5" y="6" width="19" height="12" rx="2"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      
      <h2>Apertura de caja</h2>
      <div class="sub">Registra el monto con el que inicias tu turno antes de ingresar al sistema.</div>
      
      <div class="cajero-chip" id="cajeroInfo">
        <div class="a" id="avatarInicial">JR</div>
        <div>
          <div class="n" id="nombreUsuario">Jorge Ramírez</div>
          <div class="r" id="rolUsuario">Administrador · Turno mañana</div>
        </div>
      </div>
      
      <div class="field">
        <label>Monto de apertura</label>
        <div class="amount-input">
          <span>S/</span>
          <input type="number" id="montoApertura" placeholder="0.00" value="200.00" step="0.01" min="0">
        </div>
      </div>
      
      <div class="field">
        <label>Observaciones (opcional)</label>
        <textarea rows="3" placeholder="Ej. Se recibe caja completa en billetes y monedas"></textarea>
      </div>
      
      <button class="btn-primary" onclick="handleAperturaCaja()">Abrir caja e ingresar al sistema</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const userData = sessionStorage.getItem('user');
      if (userData) {
        const user = JSON.parse(userData);
        document.getElementById('avatarInicial').textContent = user.initials || 'U';
        document.getElementById('nombreUsuario').textContent = user.name || 'Usuario';
        document.getElementById('rolUsuario').textContent = user.role + ' · Turno mañana';
      } else {
        window.location.href = '../public/login.html';
      }
    });

    function handleAperturaCaja() {
      const monto = document.getElementById('montoApertura').value;
      if (!monto || parseFloat(monto) <= 0) {
        alert('⚠️ Por favor, ingresa un monto de apertura válido.');
        return;
      }
      sessionStorage.setItem('montoApertura', monto);
      window.location.href = 'venta.html';
    }
  </script>
</body>
<!-- 🔥 FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script type="module" src="../js/conexion.js"></script>
<script type="module" src="../js/auth.js"></script>
<script src="../js/app.js"></script>
</html>
